services:
  postgres:
    image: postgres:15
    container_name: toast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toast
      POSTGRES_PASSWORD: toast
      POSTGRES_DB: toast
    mem_limit: 800m
    memswap_limit: 800m
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toast -d toast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
